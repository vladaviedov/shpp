name: Coverage Report

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  linux-test:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'
    - name: Download dependencies
      run: go get ./src
    - name: Run coverage analysis
      run: make coverage
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.html
